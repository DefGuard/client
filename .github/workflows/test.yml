name: Test backend

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "1"
  # sccache
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    runs-on:
      - codebuild-defguard-client-runner-${{ github.run_id }}-${{ github.run_attempt }}

    container:
      image: public.ecr.aws/docker/library/rust:1
      options: --user root

    defaults:
      run:
        working-directory: ./src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install required packages
        run: |
          apt-get update
          apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libxdo-dev unzip protobuf-compiler

      - name: Check format
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Run clippy linter
        run: |
          mkdir ../dist
          rustup component add clippy
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo extensions
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest

      - name: Run cargo deny
        working-directory: ./src-tauri
        run: cargo deny check --hide-inclusion-graph

      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast
