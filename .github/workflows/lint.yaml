name: 'lint'

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
      - 'release/**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'

jobs:
  lint-web:
    runs-on:
      - codebuild-defguard-client-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent)
          mkdir -p "$STORE_PATH"
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('new-ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # Change to '--frozen-lockfile' once this gets fixed:
      # https://github.com/pnpm/action-setup/issues/40
      - name: Install Node dependencies for new UI
        run: |
          cd new-ui
          pnpm install --no-frozen-lockfile

      - name: Run Biome and Prettier Lint for new UI
        run: |
          cd new-ui
          pnpm lint

      - name: Audit new UI
        run: |
          cd new-ui
          pnpm audit --prod
