name: "Test posture checks gathering"
on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - linux-ci-posture
    paths-ignore:
      - '*.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  SQLX_OFFLINE: "1"

jobs:

  test-linux-postures-unencrypted:
    name: Linux postures - unencrypted
    env:
      DATABASE_URL: /db
    runs-on:
      - codebuild-defguard-posture-linux-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev unzip protobuf-compiler libprotobuf-dev rpm cryptsetup-bin util-linux

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::linux::setup1 -- --ignored

  test-linux-postures-encrypted:
    name: Linux postures - encrypted
    env:
      DATABASE_URL: /db
    runs-on:
      - self-hosted
      - Linux
      - virtual
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev unzip protobuf-compiler libprotobuf-dev rpm cryptsetup-bin util-linux

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::linux::setup2 -- --ignored

  test-windows-postures-setup1:
    if: false
    name: Windows postures - setup1
    runs-on:
      - self-hosted
      - X64
      - Windows
      - noad
    steps:

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        shell: cmd
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::windows::setup1 -- --ignored

  test-windows-postures-setup2:
    if: false
    name: Windows postures - setup2
    runs-on:
      - self-hosted
      - X64
      - Windows
      - ad
    steps:

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        shell: cmd
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::windows::setup2 -- --ignored

  test-macos-postures-unencrypted:
    if: false
    name: macOS postures - unencrypted
    runs-on:
      - self-hosted
      - macOS
      - native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::macos::setup1 -- --ignored

  test-macos-postures-encrypted:
    if: false
    name: macOS postures - encrypted
    runs-on:
      - self-hosted
      - macOS
      - virtual
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::macos::setup2 -- --ignored
