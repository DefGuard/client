name: "Test posture checks gathering"
on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'stable/**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  SQLX_OFFLINE: "1"

jobs:

  test-linux-postures-unencrypted:
    if: false
    name: Linux postures - unencrypted
    runs-on:
      - codebuild-defguard-posture-linux-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libxdo-dev unzip protobuf-compiler libprotobuf-dev rpm cryptsetup-bin util-linux

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::linux::setup1 -- --ignored

  test-linux-postures-encrypted:
    name: Linux postures - encrypted
    runs-on:
      - self-hosted
      - Linux
      - virtual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libxdo-dev unzip protobuf-compiler libprotobuf-dev rpm cryptsetup-bin util-linux

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::linux::setup2 -- --ignored

  test-windows-postures-setup1:
    name: Windows postures - setup1
    runs-on:
      - self-hosted
      - X64
      - Windows
      - noad
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        shell: cmd
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::windows::setup1 -- --ignored

  test-windows-postures-setup2:
    name: Windows postures - setup2
    runs-on:
      - self-hosted
      - X64
      - Windows
      - ad
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        shell: cmd
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::windows::setup2 -- --ignored

  test-macos-postures-unencrypted:
    name: macOS postures - unencrypted
    runs-on:
      - self-hosted
      - macOS
      - native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::macos::setup1 -- --ignored

  test-macos-postures-encrypted:
    name: macOS postures - encrypted
    runs-on:
      - self-hosted
      - macOS
      - virtual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        working-directory: src-tauri/
        run: |
          cargo test -p defguard-client-posture --locked --lib inspector::tests::ci::macos::setup2 -- --ignored
