name: "Nightly builds"
on:
  push:
    branches:
      - nightly-builds
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  SQLX_OFFLINE: "1"
  S3_BUCKET: nightly.defguard.net
  S3_PREFIX: defguard-client
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  prepare:
    runs-on:
      - self-hosted
      - Linux
      - X64
    outputs:
      branches: ${{ steps.set.outputs.branches }}
      stamp: ${{ steps.set.outputs.stamp }}
    steps:
      - name: Set branches and timestamp
        id: set
        run: |
          echo 'branches=["release/2.1"]' >> ${GITHUB_OUTPUT}
          echo "stamp=$(date -u +%H-%M_%d-%m-%Y)" >> ${GITHUB_OUTPUT}

  build-linux:
    needs: prepare
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
        architecture: [ARM64, X64]
        include:
          - architecture: ARM64
            deb_arch: arm64
            binary_arch: aarch64
          - architecture: X64
            deb_arch: amd64
            binary_arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: new-ui/.nvmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent)
          mkdir -p "$STORE_PATH"
          echo "STORE_PATH=$STORE_PATH" >> ${GITHUB_ENV}

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('new-ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Node dependencies for new UI
        run: |
          cd new-ui
          pnpm install --no-frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev unzip protobuf-compiler libprotobuf-dev rpm awscli jq

      - name: Write build version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
          echo "DEFGUARD_CLIENT_BUILD_VERSION=${VERSION}-nightly" >> ${GITHUB_ENV}
          BRANCH="${{ matrix.branch }}"
          echo "BRANCH=${BRANCH//\//-}" >> ${GITHUB_ENV}

      - name: Build new UI
        run: |
          cd new-ui
          pnpm build

      - name: Build packages
        uses: tauri-apps/tauri-action@v0.5.23 # .24 seems broken, TODO: update when fixed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: "--bundles deb,rpm"

      - name: Upload DEB and RPM to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_NIGHTLY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY_NIGHTLY }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
        run: |
          NAME="defguard-client-${{ matrix.binary_arch }}-${STAMP}"
          aws s3 cp --acl public-read \
            "src-tauri/target/release/bundle/deb/defguard-client_${VERSION}_${{ matrix.deb_arch }}.deb" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/${BRANCH}/${NAME}.deb"
          aws s3 cp --acl public-read \
            "src-tauri/target/release/bundle/rpm/defguard-client-${VERSION}-1.${{ matrix.binary_arch }}.rpm" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/${BRANCH}/${NAME}.rpm"

  build-macos-pkg:
    needs: prepare
    runs-on:
      - self-hosted
      - macOS
      - native
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      APPLE_SIGNING_IDENTITY: "Apple Distribution: defguard sp. z o.o. (82GZ7KN29J)"
      APPLE_SIGNING_IDENTITY_INSTALLER: "3rd Party Mac Developer Installer: defguard sp. z o.o. (82GZ7KN29J)"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - name: Write build version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
          echo "DEFGUARD_CLIENT_BUILD_VERSION=${VERSION}-nightly" >> ${GITHUB_ENV}
          BRANCH="${{ matrix.branch }}"
          echo "BRANCH=${BRANCH//\//-}" >> ${GITHUB_ENV}

      - uses: actions/setup-node@v6
        with:
          node-version-file: new-ui/.nvmrc

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 11

      - name: Get pnpm store directory
        run: |
          STORE_PATH=$(pnpm store path --silent)
          mkdir -p "$STORE_PATH"
          echo "STORE_PATH=$STORE_PATH" >> ${GITHUB_ENV}

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('new-ui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Node dependencies for New UI
        run: |
          cd new-ui
          pnpm install --no-frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Set build number
        run: |
          sed -i '' "s,@BUILD_NUMBER@,${{ github.run_number }}," swift/extension/VPNExtension.xcodeproj/project.pbxproj
          sed -i '' "s,@BUILD_NUMBER@,${{ github.run_number }}," src-tauri/client-cli/Info.plist
          sed -i '' "s,@BUILD_NUMBER@,${{ github.run_number }}," src-tauri/tauri.macos.conf.json

      - name: Build new UI
        run: |
          cd new-ui
          pnpm build

      - name: Unlock keychain
        run: |
          security unlock-keychain -p "${{ secrets.BUILD_KEYCHAIN_PASSWORD }}" build.keychain

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --config src-tauri/tauri.app.conf.json --target universal-apple-darwin

      - name: Build installation package
        run: |
          xcrun productbuild --keychain build.keychain \
            --sign "${{ env.APPLE_SIGNING_IDENTITY_INSTALLER }}" \
            --component "src-tauri/target/universal-apple-darwin/release/bundle/macos/Defguard.app" \
            /Applications defguard-client.pkg

      - name: Upload PKG to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_NIGHTLY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY_NIGHTLY }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:${PATH}"
          aws s3 cp --acl public-read defguard-client.pkg \
            "s3://${S3_BUCKET}/${S3_PREFIX}/${BRANCH}/defguard-client-universal-${STAMP}.pkg"

