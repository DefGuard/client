name: "Nightly builds"
on:
  push:
    branches:
      - nightly-builds
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

env:
  S3_BUCKET: nightly.defguard.net
  S3_PREFIX: defguard-client
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  release-2-1:
    uses: ./.github/workflows/nightly-build-2x.yaml
    with:
      branch: release/2.1
      s3_bucket: nightly.defguard.net
      s3_prefix: defguard-client
      aws_region: eu-central-1
    secrets: inherit

  main:
    uses: ./.github/workflows/nightly-build-1x.yaml
    with:
      branch: main
      s3_bucket: nightly.defguard.net
      s3_prefix: defguard-client
      aws_region: eu-central-1
    secrets: inherit

  update-index:
    needs:
      - release-2-1
      - main
    if: always()
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      - name: Install awscli
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli jq

      - name: Generate and upload index.html
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_NIGHTLY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY_NIGHTLY }}
        run: |
          aws s3api list-objects-v2 \
            --bucket "${S3_BUCKET}" \
            --prefix "${S3_PREFIX}/" \
            --query 'Contents[?Size > `0`].{key: Key, size: Size, modified: LastModified}' \
            --output json > objects.json

          {
            echo '<!doctype html>'
            echo '<meta charset="utf-8">'
            echo '<title>defguard-client nightly builds</title>'
            echo '<style>body{font-family:sans-serif;margin:2rem}table{border-collapse:collapse;margin-bottom:2rem}th,td{padding:.3rem 1.5rem .3rem 0;border-bottom:1px solid #ddd;white-space:nowrap}</style>'
            echo '<h1>defguard-client nightly builds</h1>'
            jq -r '
              (. // [])
              | group_by(.key | split("/")[1])
              | map(sort_by(.modified) | reverse)
              | sort_by(.[0].modified) | reverse
              | .[]
              | "<h2>\(.[0].key | split("/")[1])</h2>",
                "<table><tr><th align=\"left\">File</th><th align=\"right\">Size</th><th align=\"left\">Uploaded on (UTC)</th></tr>",
                (.[] | "<tr><td><a href=\"/\(.key)\">\(.key | split("/")[2])</a></td><td align=\"right\">\((.size / 104857.6 | round) / 10) MiB</td><td>\(.modified)</td></tr>"),
                "</table>"
            ' objects.json
          } > index.html
          cat index.html
          aws s3 cp --acl public-read --content-type text/html \
            index.html "s3://${S3_BUCKET}/index.html"
