[package]
name = "defguard-client-core"
description = "Shared business logic for the Defguard desktop client (Tauri-free)"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
defguard-client-common = { path = "../common" }
defguard-client-proto = { path = "../client-proto" }
defguard_wireguard_rs.workspace = true
dirs-next.workspace = true
futures-util.workspace = true
hyper-util.workspace = true
log.workspace = true
os_info.workspace = true
prost.workspace = true
reqwest.workspace = true
rust-ini.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sqlx.workspace = true
strum.workspace = true
struct-patch = "0.12"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tower.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
futures-util.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
wiremock.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-network-extension = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
hex.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation"] }
